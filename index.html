/* ValisoaChessboard CSS */
/* Styles purs de ValisoaChessboard (Ne contient aucun style global) */
.valisoa-board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 100%;
    height: 100%;
    aspect-ratio: 1 / 1; /* Garantit que l'échiquier reste toujours un carré parfait */
    border: 2px solid #333;
    border-radius: 4px;
    overflow: hidden;
    touch-action: none; /* Empêche le navigateur de scroller quand on glisse une pièce sur tactile */
}

.valisoa-square {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
}

.valisoa-square.white {
    background-color: #f0d9b5;
    color: #b58863;
}

.valisoa-square.black {
    background-color: #b58863;
    color: #f0d9b5;
}

.valisoa-piece {
    width: 90%;
    height: 90%;
    cursor: grab;
    user-select: none;
    z-index: 10;
}

.valisoa-piece:active {
    cursor: grabbing;
}

/* --- INTERACTIVITÉ --- */
/* Style de la pièce pendant qu'elle est soulevée (Drag) */
.valisoa-piece.dragging {
    position: fixed; /* Se détache de l'échiquier pour suivre le curseur exactement */
    z-index: 1000; /* Passe par dessus tout le reste */
    pointer-events: none; /* Laisse passer le curseur pour détecter la case d'arrivée en dessous */
    transform: scale(1.15); /* Effet d'agrandissement pour donner l'impression de la soulever */
    transition: transform 0.1s;
    filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); /* Belle ombre portée */
}

/* Style de la case sélectionnée pour le Click-to-Move */
.valisoa-square.selected::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background-color: rgba(20, 85, 30, 0.4); /* Voile vert transparent */
    z-index: 5; /* Au dessus de la couleur de la case, mais en dessous de la pièce */
}

/* Style des cases du dernier coup joué (départ et arrivée) */
.valisoa-square.highlight::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background-color: rgba(155, 199, 0, 0.41); /* Vert/Jaune clair (style Chess.com) */
    z-index: 4; /* En dessous de la sélection */
}

/* Style des pre-moves (Phase 7 - Lichess) */
.valisoa-square.premove::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background-color: rgba(220, 30, 30, 0.5); /* Rouge transparent */
    z-index: 4;
}

/* --- PROMOTION MENU --- */
.valisoa-promotion-menu {
    position: absolute;
    width: 100%;
    background-color: #fff;
    border-radius: 4px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    z-index: 2000;
    display: flex;
    flex-direction: column;
}

.valisoa-promotion-menu.down {
    top: 0;
}

.valisoa-promotion-menu.up {
    bottom: 0;
    flex-direction: column-reverse; /* Garde la Reine sur la case d'arrivée pour les pions noirs */
}

.valisoa-promotion-piece {
    width: 100%;
    aspect-ratio: 1; /* Reste carré */
    cursor: pointer;
    border-radius: 50%;
    padding: 5px;
    transition: background 0.1s;
}

.valisoa-promotion-piece:hover {
    background-color: rgba(0, 0, 0, 0.1);
}

/* --- NOTATIONS (Coordonnées) --- */
.valisoa-notation {
    position: absolute;
    font-size: 11px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    user-select: none;
    pointer-events: none; /* Ne doit pas gêner les clics sur la case */
    z-index: 2; /* Sous la pièce, sur la case */
}

.valisoa-notation.alpha {
    bottom: 2px;
    right: 3px;
}

.valisoa-notation.numeric {
    top: 2px;
    left: 3px;
}

/* Couleurs des notations selon la couleur de la case (contraste) */
.valisoa-square.white .valisoa-notation {
    color: #739552; /* Vert foncé sur case claire */
}
.valisoa-square.black .valisoa-notation {
    color: #ebecd0; /* Blanc cassé sur case sombre */
}


.valisoa-blindfold-active .valisoa-piece {
  opacity: 0 !important;
}

function normalizeSanInput(raw) {
  if (!raw) return "";
  let s = raw.trim().replace(/^0-0-0/, "O-O-O").replace(/^0-0/, "O-O");
  // Support notation algébrique française (C, F, T, D, R) -> anglaise (N, B, R, Q, K)
  s = s
    .replace(/^C(?=[a-h1-8x])/, "N")
    .replace(/^F(?=[a-h1-8x])/, "B")
    .replace(/^T(?=[a-h1-8x])/, "R")
    .replace(/^D(?=[a-h1-8x])/, "Q")
    .replace(/^R(?=[a-h1-8x])/, "K")
    .replace(/=D/i, "=Q")
    .replace(/=T/i, "=R")
    .replace(/=F/i, "=B")
    .replace(/=C/i, "=N");
  return s;

  async function syncLichessGamesAndProfile(customPgnText = "") {
    let cleanUser = (bu || "").trim();
    let rawPgnToSync = String(customPgnText || "").trim();

    if (!cleanUser && !rawPgnToSync) {
      Ze("Entre d'abord ton pseudo Lichess ou colle un PGN multi-parties à synchroniser !");
      return;
    }

    setLichessSyncBusy(true);
    Ze("🔄 Synchronisation Lichess en cours (Profil Elo + Parties PGN vers SQLite)...");

    let fetchedProfile = null;
    if (cleanUser && !rawPgnToSync) {
      try {
        let profRes = await fetch(`https://lichess.org/api/user/${encodeURIComponent(cleanUser)}`);
        if (profRes.ok) {
          let pData = await profRes.json();
          fetchedProfile = {
            username: pData.username || cleanUser,
            classical: pData.perfs?.classical?.rating || null,
            rapid: pData.perfs?.rapid?.rating || null,
            blitz: pData.perfs?.blitz?.rating || null,
            bullet: pData.perfs?.bullet?.rating || null,
            puzzle: pData.perfs?.puzzle?.rating || null,
            countAll: pData.count?.all || 0,
            fetchedAt: new Date().toISOString()
          };
          setLichessProfile(fetchedProfile);
        }
      } catch {}

      try {
        let gamesRes = await fetch(
          `https://lichess.org/api/games/user/${encodeURIComponent(cleanUser)}?max=12&opening=true`,
          { headers: { Accept: "application/x-chess-pgn" } }
        );
        if (gamesRes.ok) {
          rawPgnToSync = await gamesRes.text();
        }
      } catch {}
    }

    if (sqlMode === "sqlite_native") {
      try {
        let res = await fetch("/api/lichess/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: cleanUser,
            raw_pgn: rawPgnToSync,
            profile: fetchedProfile,
            max_games: 12
          })
        });
        if (res.ok) {
          let st = await res.json();
          applyServerState(st);
          setLichessSyncBusy(false);
          let rep = st.syncReport || {};
          if (rep.parsedCount > 0) {
            Ze(
              `✅ ${rep.insertedCount} nouvelle(s) partie(s) enregistrée(s) dans SQLite (${rep.duplicatesSkipped} doublon(s) ignoré(s)) · Total : ${rep.totalInDb}`
            );
          } else if (st.lichessProfile) {
            Ze(`✅ Profil Lichess @${st.lichessProfile.username} synchronisé dans SQLite !`);
          } else {
            Ze("ℹ️ Aucune nouvelle partie PGN trouvée (vérifie ta connexion ou colle un PGN).");
          }
          return;
        }
      } catch {}
    }

    // Fallback hors-serveur
    if (rawPgnToSync && window.ValisoaLichess) {
      let parsed = window.ValisoaLichess.parsePgnGamesBatch(
        rawPgnToSync,
        cleanUser,
        window.ValisoaChesspgnparser,
        window.ValisoaChessLite
      );
      setLichessGames((prev) => {
        let existingIds = new Set(prev.map((g) => g.id));
        let added = parsed.filter((g) => !existingIds.has(g.id));
        return [...added, ...prev];
      });
      Ze(`✅ ${parsed.length} partie(s) PGN analysée(s) avec ValisoaLichess !`);
    }
    setLichessSyncBusy(false);
  }

  async function convertCurrentPgnFrameToFsrsPuzzle() {
    if (!pgnParsedGame || !Array.isArray(pgnParsedGame.frames) || pgnParsedGame.frames.length < 2) {

      return;

    let idx = Math.min(pgnStepIdx, pgnParsedGame.frames.length - 2);
    let curFrame = pgnParsedGame.frames[idx];
    let nextMoves = pgnParsedGame.frames.slice(idx + 1, Math.min(pgnParsedGame.frames.length, idx + 4)).map((f) => f.san);
    let white = pgnParsedGame.tags?.White || "Blancs";
    let black = pgnParsedGame.tags?.Black || "Noirs";
    let moveNumber = Math.floor(idx / 2) + 1;

    if (sqlMode === "sqlite_native") {

        let res = await fetch("/api/lichess/to-puzzle", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            fen: curFrame.fen,
            solution_moves: nextMoves,
            white,
            black,
            moveNumber,
            title: `Position PGN · ${white} vs ${black} (Coup ${moveNumber})`
          })
        });
        if (res.ok) {
          let st = await res.json();
          applyServerState(st);
          Ze(`🎯 Position (Coup ${moveNumber}) convertie en Puzzle FSRS dans SQLite !`);
          return;
        }
      } catch {}
    }

    if (window.ValisoaLichess) {
      let built = window.ValisoaLichess.convertPositionToFsrsPuzzle(
        {
          fen: curFrame.fen,
          solution_moves: nextMoves,
          white,
          black,
          moveNumber
        },
        window.ValisoaChessLite
      );
      Yu((prev) => [{ ...built, id: Date.now() }, ...prev]);
      Ze(`🎯 Position PGN (Coup ${moveNumber}) ajoutée aux Puzzles FSRS !`);
    }
  }
